# cargo-deny configuration — ADR.md §10 (minimal, offline-friendly deps).
# Checked in CI via EmbarkStudios/cargo-deny-action.

[graph]
targets = []
# The `embedded` feature pulls llama-cpp-2, which vendors llama.cpp; with
# all-features off that whole subtree was never licence- or advisory-checked.
all-features = true

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "ISC",
    "BSD-3-Clause",
    "Zlib",
    "MPL-2.0",
]
confidence-threshold = 0.93

[bans]
# A51: stays a warning deliberately. Five crates are duplicated transitively
# today (getrandom, itertools, shlex, syn, windows-sys — the classic syn 1/2
# split among them), none of them ours to unify, so "deny" would fail CI on
# day one and buy nothing. The audit's supporting measurement ("no duplicate
# name+version pairs") counted something that is unique by definition in a
# lockfile; the real figure is above, and it is why this line reads "warn".
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[advisories]
version = 2
yanked = "deny"
ignore = []
