[workspace]
resolver = "3"
members = [
    "crates/rusta-llm",
    "crates/rusta-edit",
    "crates/rusta-core",
    "crates/rusta-tools",
    "crates/rusta-repomap",
    "crates/rusta-dispatch",
    "crates/rusta-validate",
    "crates/rusta-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/vladimirpesic/rusta"

[workspace.dependencies]
# Shared dependency versions; member crates inherit with `dep.workspace = true`.
# The allowed dependency set is contractual: DEVELOPMENT_PLAN.md §10. Every entry
# must earn its place — minimal feature sets, no OpenSSL, no async-trait.
anyhow = "1"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
# Aider-style REPL line editing (plan §6.9, §10). Default features off: the
# `helix` editing mode is optional sugar; core line editing, history, and
# signals are feature-independent.
reedline = { version = "0.51", default-features = false }
# Config file parsing (plan §7, §10 — "config & tool-call args only").
toml = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
# `io-util` added post-audit: §6.1's output caps must bound *memory*, not just
# the observation text, so both subprocess call sites drain their pipes
# incrementally (`AsyncReadExt`) instead of buffering with `wait_with_output`.
# It was already present transitively via reqwest → hyper-util; depending on
# that silently is exactly the coupling the audit flagged elsewhere.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "process", "signal"] }
# Snapshot testing (DEVELOPMENT_PLAN.md §10, dev-only) — failure-feedback
# contract of rusta-edit and later validator/repomap golden files.
insta = "1"
# Embedded backend (DEVELOPMENT_PLAN.md §6.2, §10): pinned EXACT — the crate
# ignores semver. Default features stay off (no OpenMP, no android stdcxx
# flags) so every consumer only needs cmake + a C++ toolchain; rusta-llm's
# `embedded` feature additionally enables its `sampler` feature.
llama-cpp-2 = { version = "=0.1.156", default-features = false }
# Companion of llama-cpp-2 (same version range, unified by cargo): its
# detokenization API (`LlamaModel::token_to_piece`) takes an
# `encoding_rs::Decoder` by type, so incremental UTF-8-safe token decoding
# requires depending on it directly behind the same `embedded` feature.
encoding_rs = "0.8"
# Case-sensitive regexes for the grep tool (§6.4) and the shell deny-list
# (§6.12) — mandated twice by the plan, so it earns its §10 place. Default
# feature set so user-supplied deny patterns (\b, \w, unicode classes) behave
# as documented.
regex = "1"
# Repo-map parsing (DEVELOPMENT_PLAN.md §6.5, §10): tree-sitter core + the
# per-language grammar crates, all pinned EXACT. The core/grammar split is the
# tree-sitter-language 0.1 compatibility layer (`LanguageFn`), so grammar crates
# deliberately lag the core release train — this exact matrix is verified to
# build and parse together (same combo as the devscriptor reference project).
# Grammar drift is caught by the per-language query compile test (§13).
tree-sitter = "=0.25.9"
tree-sitter-rust = "=0.24.2"
tree-sitter-python = "=0.25.0"
tree-sitter-javascript = "=0.25.0"
tree-sitter-typescript = "=0.23.2"
tree-sitter-go = "=0.25.0"
tree-sitter-c = "=0.24.2"
tree-sitter-cpp = "=0.23.4"

[workspace.lints.rust]
# R10 (DEVELOPMENT_PLAN.md §2): no unsafe code in any core crate. The only permitted
# unsafe in the project lives inside the `llama-cpp-2` crate behind the `embedded`
# feature, isolated from all Rusta code by the Backend trait boundary.
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
