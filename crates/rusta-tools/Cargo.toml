[package]
name = "rusta-tools"
description = "Phase-gated tool registry for Rusta: the ten canonical agent tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
rusta-core = { path = "../rusta-core" }
rusta-dispatch = { path = "../rusta-dispatch" }
rusta-edit = { path = "../rusta-edit" }
rusta-llm = { path = "../rusta-llm" }
rusta-repomap = { path = "../rusta-repomap" }
# For `capped_read` only: the §6.1 memory bound on subprocess output is a
# safety fix, and one implementation must serve both subprocess call sites
# (`shell` here, validators there) so the two can never drift apart.
rusta-validate = { path = "../rusta-validate" }
regex.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
