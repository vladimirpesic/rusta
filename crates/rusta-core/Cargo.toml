[package]
name = "rusta-core"
description = "Core of Rusta: phase-gated state machine, context manager, prompt compiler, session persistence"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
rusta-edit = { path = "../rusta-edit" }
rusta-llm = { path = "../rusta-llm" }
serde.workspace = true
# Already in this crate's closure via rusta-llm; declared directly for
# `proc::capped_read`, the §6.1 memory bound both subprocess call sites share.
tokio.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["io-util", "macros", "rt"] }
rusta-edit = { path = "../rusta-edit" }
rusta-llm = { path = "../rusta-llm" }
tempfile.workspace = true

[lints]
workspace = true
