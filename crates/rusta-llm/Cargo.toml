[package]
name = "rusta-llm"
description = "Dual LLM backend for Rusta: OpenAI-compatible HTTP streaming client plus an embedded llama.cpp backend (feature-gated)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
encoding_rs = { workspace = true, optional = true }
futures.workspace = true
llama-cpp-2 = { workspace = true, optional = true }
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["net"] }

[features]
# In-process llama.cpp backend (ADR.md §6.2, §10). Opt-in: the
# default artifact stays cmake-free; enabling this builds llama.cpp.
default = []
embedded = ["dep:llama-cpp-2", "dep:encoding_rs", "llama-cpp-2/sampler"]
# GPU offload: `embedded` plus llama.cpp CUDA kernels (CUDA toolkit required).
embedded-cuda = ["embedded", "llama-cpp-2/cuda"]

[lints]
workspace = true
